<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>控制面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#140a22;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.comic-admin{width:760px;max-width:95vw;background:#f7f2fb;border:3px solid #1b0f2a;border-radius:18px;box-shadow:10px 10px 0 #1b0f2a;overflow:hidden;color:#1b0f2a}
.head{background:linear-gradient(135deg,#c898e8,#a86bff);padding:18px;display:flex;justify-content:space-between;align-items:center;color:#1b0f2a;font-weight:800;font-size:16px}
.head-close{text-decoration:none;color:#1b0f2a;background:#fff;border:2px solid #1b0f2a;border-radius:8px;padding:6px 14px;font-weight:700;transition:0.2s}
.head-close:hover{background:#ff8080;color:#fff}
.tabs{display:flex;background:#e9d8f4;border-bottom:2px solid #1b0f2a;overflow-x:auto}
.tab{padding:10px 18px;cursor:pointer;font-weight:700;font-size:13px;border-right:2px solid #1b0f2a;background:#fff;transition:0.2s;white-space:nowrap}
.tab:hover{transform:translateY(-2px)}
.tab.active{background:#c898e8}
.content{padding:22px;min-height:380px}
.panel{display:none;animation:fade .25s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:#fff;border:2px solid #1b0f2a;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:4px 4px 0 #1b0f2a}
label{font-size:13px;font-weight:700;color:#1b0f2a;display:block;margin-bottom:6px}
input{width:100%;padding:10px;border:2px solid #1b0f2a;border-radius:8px;outline:none;transition:0.2s;font-family:inherit;color:#1b0f2a;background:#fff}
input:focus{background:#f0e4fb;transform:scale(1.01)}
.switch-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed #1b0f2a}
.switch-row span{color:#1b0f2a;font-size:14px;font-weight:500}
.switch{width:46px;height:24px;border:2px solid #1b0f2a;border-radius:30px;background:#ddd;position:relative;cursor:pointer;transition:0.2s}
.switch::after{content:"";position:absolute;width:18px;height:18px;top:1px;left:2px;border-radius:50%;background:#1b0f2a;transition:0.2s}
.switch.active{background:#c898e8;box-shadow:0 0 10px rgba(200,152,232,0.6)}
.switch.active::after{left:24px;background:#fff}
.btn{padding:10px 18px;border:2px solid #1b0f2a;background:#c898e8;border-radius:10px;cursor:pointer;font-weight:700;box-shadow:4px 4px 0 #1b0f2a;transition:0.15s;color:#1b0f2a}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #1b0f2a}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.status{padding:10px 14px;background:#fff;border:2px solid #1b0f2a;border-radius:10px;margin-bottom:16px;font-size:13px;color:#1b0f2a}
@media (max-width:600px){
  .comic-admin{max-width:100vw;border-radius:12px;box-shadow:4px 4px 0 #1b0f2a}
  .tabs{overflow-x:auto}
  .tab{padding:8px 12px;font-size:12px}
  .content{padding:16px}
  .card{padding:12px}
  .btns{flex-direction:column;align-items:stretch}
  .btn{width:100%;text-align:center}
}
</style>
</head>
<body>
<div class="comic-admin">
  <div class="head">
    ⚙️ 控制面板
    <a href="https://Yukecil.github.io/yukecil/" class="head-close">返回主页</a>
  </div>
  <div class="tabs">
    <div class="tab active">资料编辑</div>
    <div class="tab">外观设置</div>
    <div class="tab">系统功能</div>
  </div>
  <div class="content">
    <div class="panel active">
      <div class="status" id="syncStatus">正在连接...</div>
      <div class="card"><label>昵称</label><input id="adminName" value="Yukecil"></div>
      <div class="card"><label>邮箱</label><input id="adminEmail" value="hello@example.com"></div>
      <div class="card"><label>Telegram（不含@）</label><input id="adminTelegram" value="@yourname"></div>
      <div class="btns"><button class="btn" onclick="saveAllToCloud()">💾 保存并同步到云端</button></div>
    </div>
    <div class="panel">
      <div class="card"><label>头像地址</label><input id="adminAvatar" placeholder="https://..."></div>
      <div class="card"><label>手机背景</label><input id="adminBgMobile" placeholder="手机端背景URL"></div>
      <div class="card"><label>电脑背景</label><input id="adminBgDesktop" placeholder="电脑端背景URL"></div>
      <div class="btns"><button class="btn" onclick="saveAllToCloud()">🖼️ 保存并同步到云端</button></div>
    </div>
    <div class="panel">
      <div class="card">
        <div class="switch-row"><span>一言展示</span><div class="switch active" id="toggleHitokoto"></div></div>
        <div class="switch-row"><span>粒子动画</span><div class="switch active" id="toggleParticles"></div></div>
        <div class="switch-row"><span>星空背景</span><div class="switch active" id="toggleStars"></div></div>
      </div>
      <div class="btns"><button class="btn" onclick="saveAllToCloud()">⚡ 保存开关状态</button></div>
    </div>
  </div>
</div>

<script>
  // 标签页切换
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll('.panel')[i].classList.add('active');
    });
  });
  ['toggleHitokoto','toggleParticles','toggleStars'].forEach(id => {
    document.getElementById(id).addEventListener('click', function(){ this.classList.toggle('active'); });
  });
</script>

<!-- CloudBase 读写 -->
<script src="https://imgcache.qq.com/qcloud/tcbjs/1.10.8/tcb.js"></script>
<script>
  tcb.init({ env: 'yukecil-d1gzo460b1d4edf8d' }); // 换成你自己的环境ID
  const db = tcb.database();

  // 匿名登录
  tcb.auth({ persistence: 'local' }).anonymousAuthProvider().signIn()
    .then(() => console.log('✅ 匿名登录成功'))
    .catch(e => document.getElementById('syncStatus').textContent = '❌ 登录失败，请刷新重试');

  // 加载云端配置
  async function loadFromCloud() {
    try {
      const res = await db.collection('config').doc('site').get();
      if (res.data && res.data.length > 0) {
        const data = res.data[0];
        document.getElementById('adminName').value = data.title || 'Yukecil';
        document.getElementById('adminEmail').value = data.email || '';
        document.getElementById('adminTelegram').value = data.telegram || '';
        document.getElementById('adminAvatar').value = data.avatar || '';
        document.getElementById('adminBgMobile').value = data.bgMobile || '';
        document.getElementById('adminBgDesktop').value = data.bgDesktop || '';
        document.getElementById('toggleHitokoto').classList.toggle('active', data.hitokotoEnabled !== false);
        document.getElementById('toggleParticles').classList.toggle('active', data.particlesEnabled !== false);
        document.getElementById('toggleStars').classList.toggle('active', data.starsEnabled !== false);
        document.getElementById('syncStatus').textContent = '✅ 已加载云端配置';
      } else {
        document.getElementById('syncStatus').textContent = '⚠️ 云端暂无数据，请保存一次';
      }
    } catch (e) {
      document.getElementById('syncStatus').textContent = '❌ 加载失败，请检查网络';
    }
  }

  // 保存到云端
  async function saveAllToCloud() {
    const statusEl = document.getElementById('syncStatus');
    statusEl.textContent = '⏳ 正在保存...';
    try {
      await db.collection('config').doc('site').set({
        title: document.getElementById('adminName').value.trim(),
        email: document.getElementById('adminEmail').value.trim(),
        telegram: document.getElementById('adminTelegram').value.trim(),
        avatar: document.getElementById('adminAvatar').value.trim(),
        bgMobile: document.getElementById('adminBgMobile').value.trim(),
        bgDesktop: document.getElementById('adminBgDesktop').value.trim(),
        hitokotoEnabled: document.getElementById('toggleHitokoto').classList.contains('active'),
        particlesEnabled: document.getElementById('toggleParticles').classList.contains('active'),
        starsEnabled: document.getElementById('toggleStars').classList.contains('active')
      });
      statusEl.textContent = '✅ 已保存到云端，主页将即时更新';
    } catch (e) {
      statusEl.textContent = '❌ 保存失败，请重试';
      console.error(e);
    }
  }

  loadFromCloud();
</script>
</body>
</html>
