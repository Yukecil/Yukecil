<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yukecil · 挂逼版</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box }
        :root {
            --glass-bg: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.2);
            --pink: #f4a0c8;
            --purple: #a78bfa;
            --blue: #60a5fa;
            --white: rgba(255,255,255,0.95);
            --muted: rgba(255,255,255,0.6);
            --green: #4ade80;
            --red: #f87171;
        }
        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            background: #0a0a1a;
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .custom-bg-layer {
            position: fixed; inset: 0; z-index: 0;
            background-size: cover; background-position: center;
            opacity: 0; transition: opacity 0.6s; pointer-events: none;
        }
        .custom-bg-layer.active { opacity: 1; }
        .bg-scene { position: fixed; inset: 0; z-index: 0; }
        .bg-scene svg { width: 100%; height: 100%; display: block }
        .aurora {
            position: fixed; inset: 0; z-index: 1;
            background: radial-gradient(ellipse 80% 50% at 20% 10%, rgba(167,139,250,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 5%, rgba(244,160,200,0.1) 0%, transparent 55%),
                radial-gradient(ellipse 50% 60% at 50% 100%, rgba(96,165,250,0.08) 0%, transparent 50%);
            pointer-events: none;
        }
        .noise {
            position: fixed; inset: 0; z-index: 2; opacity: .02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            pointer-events: none;
        }
        .page {
            position: relative; z-index: 10;
            width: 100%; max-width: 1200px; margin: 0 auto;
            padding: 28px 36px 40px;
            display: flex; flex-direction: column; gap: 22px;
        }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
            width: 100%; max-width: 100%;
        }
        .topnav { display: flex; align-items: center; justify-content: center; padding: 20px 24px; }
        .logo {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(36px, 8vw, 64px);
            background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; letter-spacing: 8px;
            filter: drop-shadow(0 0 12px rgba(167,139,250,0.5));
            text-align: center; width: 100%; line-height: 1.2; word-break: break-word;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            width: 100%;
        }
        .clock-card {
            padding: 28px 24px;
            display: flex; flex-direction: column; align-items: center;
            gap: 16px; width: 100%;
        }
        .avatar-clock {
            width: 130px; height: 130px; border-radius: 50%; overflow: hidden;
            box-shadow: 0 0 20px rgba(167,139,250,0.3), 0 0 30px rgba(244,160,200,0.2);
            border: 1.5px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.05); flex-shrink: 0;
        }
        .avatar-clock img { width: 100%; height: 100%; object-fit: cover; }
        .digital-time {
            font-family: 'JetBrains Mono', monospace; font-size: clamp(26px, 8vw, 32px); font-weight: 500;
            background: linear-gradient(90deg, var(--pink), var(--purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; letter-spacing: 2px; text-align: center; width: 100%;
        }
        .clock-date { font-size: clamp(11px, 3vw, 12.5px); color: #ffffff; letter-spacing: .5px; text-align: center; width: 100%; }
        .hitokoto {
            margin-top: 4px; padding: 14px 6px; border-radius: 14px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            text-align: center; width: 100%; min-height: 3.2em;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .hitokoto-text { position: relative; width: 100%; display: flex; align-items: center; justify-content: center; }
        .ht-item {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            color: #ffffff; font-style: italic; font-size: clamp(15px, 4vw, 18px); line-height: 1.5;
            transition: opacity 0.8s ease; opacity: 0; padding: 0 4px;
            white-space: normal; word-break: break-word;
        }
        .ht-item.active { opacity: 1; position: relative; }
        .quick-label {
            background: linear-gradient(135deg, #a8e063, #56ab2f);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; font-size: clamp(11px, 3vw, 12px); letter-spacing: .3px; text-align: center;
        }
        .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        .quick-item {
            padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px;
            border-radius: 16px; cursor: pointer; transition: all .25s;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
        }
        .quick-item:hover {
            background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2);
            transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .quick-icon { font-size: clamp(22px, 6vw, 28px); color: var(--white); transition: color 0.2s; }
        .quick-item:hover .quick-icon { color: var(--purple); }
        .stars { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
        .star {
            position: absolute; border-radius: 50%; background: white;
            animation: twinkle var(--d,3s) ease-in-out infinite;
        }
        @keyframes twinkle { 0%,100% { opacity: var(--a,.6) } 50% { opacity: var(--b,.1) } }
        .particles { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
        .particle {
            position: absolute; border-radius: 50%;
            animation: float var(--d,8s) ease-in-out infinite;
            filter: blur(1px);
        }
        @keyframes float {
            0%,100% { transform: translateY(0) rotate(0deg); opacity: 0 }
            10%,90% { opacity: 1 }
            50% { transform: translateY(-60px) rotate(180deg) }
        }

        .football-card { padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .scoreboard {
            display: flex; align-items: center; gap: 16px;
            font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600;
        }
        .score-red { color: #f87171; text-shadow: 0 0 10px rgba(248,113,113,0.5); }
        .score-blue { color: #60a5fa; text-shadow: 0 0 10px rgba(96,165,250,0.5); }
        .score-divider { color: var(--muted); font-size: 16px; }
        .canvas-container {
            position: relative; border-radius: 12px; overflow: hidden;
            background: rgba(0,0,0,0.3); box-shadow: 0 0 20px rgba(167,139,250,0.15);
            border: 1px solid rgba(255,255,255,0.1);
            width: 100%; max-width: 440px; aspect-ratio: 5 / 3;
        }
        .canvas-container canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
        .game-status { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; text-align: center; min-height: 16px; }
    </style>
</head>
<body>
<div class="custom-bg-layer" id="customBgLayer"></div>
<div class="bg-scene" id="defaultBgScene">
    <svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a0f3c"/><stop offset="100%" stop-color="#5b1f7a"/></linearGradient></defs>
        <rect width="1600" height="900" fill="url(#sky)"/>
    </svg>
</div>
<div class="aurora"></div>
<div class="noise"></div>
<div class="stars" id="stars"></div>
<div class="particles" id="particles"></div>

<div class="page">
    <nav class="glass topnav"><div class="logo" id="logoDisplay">Yukecil</div></nav>
    <div class="main-grid">
        <div class="glass clock-card">
            <div class="avatar-clock"><img id="avatarImg" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23a78bfa'/%3E%3Ctext x='50' y='68' text-anchor='middle' fill='white' font-size='48'%3EY%3C/text%3E%3C/svg%3E"></div>
            <div class="digital-time" id="digiTime">00:00:00</div>
            <div class="clock-date" id="clockDate">加载中...</div>
            <div class="hitokoto" id="hitokotoBox"><div class="hitokoto-text"><span class="ht-item active" id="htItem1">正在加载一言...</span><span class="ht-item" id="htItem2"></span></div></div>
            <div class="glass" style="padding:12px; margin-top:8px;">
                <div class="quick-grid">
                    <div class="quick-item" id="contactEmail" onclick="window.location.href='mailto:hello@example.com'"><span class="quick-icon"><i class="fa-solid fa-envelope"></i></span><span class="quick-label">邮箱</span></div>
                    <div class="quick-item" id="contactTelegram" onclick="window.open('https://t.me/yourname')"><span class="quick-icon"><i class="fa-brands fa-telegram"></i></span><span class="quick-label">Telegram</span></div>
                </div>
            </div>
        </div>

        <div class="glass football-card">
            <div class="scoreboard">
                <span class="score-red" id="scoreRed">0</span>
                <span class="score-divider">:</span>
                <span class="score-blue" id="scoreBlue">0</span>
            </div>
            <div class="canvas-container">
                <canvas id="footballCanvas" width="440" height="264"></canvas>
            </div>
            <div class="game-status" id="footballStatus">⚽ 比赛进行中...</div>
        </div>
    </div>
</div>

<script>
// --- 现有设置和特效 ---
const settings = {
    name: localStorage.getItem('userName') || 'Yukecil',
    email: localStorage.getItem('userEmail') || 'hello@example.com',
    telegram: localStorage.getItem('userTelegram') || '@yourname',
    avatar: localStorage.getItem('userAvatar') || '',
    bgMobile: localStorage.getItem('bgMobile') || '',
    bgDesktop: localStorage.getItem('bgDesktop') || '',
    hitokoto: localStorage.getItem('hitokotoEnabled') !== 'false',
    particles: localStorage.getItem('particlesEnabled') !== 'false',
    stars: localStorage.getItem('starsEnabled') !== 'false'
};

function applySettings() {
    document.getElementById('logoDisplay').textContent = settings.name;
    if(settings.avatar) document.getElementById('avatarImg').src = settings.avatar;
    const emailEl = document.getElementById('contactEmail');
    emailEl.setAttribute('onclick', `window.location.href='mailto:${settings.email}'`);
    const tgEl = document.getElementById('contactTelegram');
    const tgUsername = settings.telegram.startsWith('@') ? settings.telegram.substring(1) : settings.telegram;
    tgEl.setAttribute('onclick', `window.open('https://t.me/${tgUsername}')`);
    document.getElementById('hitokotoBox').style.display = settings.hitokoto ? '' : 'none';
    initParticles(); initStars(); applyBackgrounds();
}
function applyBackgrounds() {
    const isMobile = window.innerWidth <= 768;
    const bgUrl = isMobile ? settings.bgMobile : settings.bgDesktop;
    const customBg = document.getElementById('customBgLayer');
    const defaultBg = document.getElementById('defaultBgScene');
    if(bgUrl) { customBg.style.backgroundImage = `url(${bgUrl})`; customBg.classList.add('active'); defaultBg.style.opacity = '0'; }
    else { customBg.classList.remove('active'); defaultBg.style.opacity = '1'; }
}
let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(applyBackgrounds, 200); });
function initParticles() {
    const container = document.getElementById('particles');
    if(!settings.particles) { container.innerHTML = ''; return; }
    if(container.children.length > 0) return;
    const colors=['rgba(167,139,250,','rgba(244,160,200,','rgba(96,165,250,','rgba(251,191,36,'];
    for(let i=0;i<8;i++){
        const p=document.createElement('div'); p.className='particle';
        const sz=Math.random()*3+1; const col=colors[Math.floor(Math.random()*colors.length)];
        p.style.cssText=`width:${sz}px;height:${sz}px;background:${col}0.6);top:${Math.random()*80+10}%;left:${Math.random()*90+5}%;--d:${(Math.random()*6+6).toFixed(1)}s;animation-delay:${(Math.random()*5).toFixed(1)}s`;
        container.appendChild(p);
    }
}
function initStars() {
    const container = document.getElementById('stars');
    if(!settings.stars) { container.innerHTML = ''; return; }
    if(container.children.length > 0) return;
    for(let i=0;i<40;i++){
        const s=document.createElement('div'); s.className='star';
        const sz=Math.random()*1.5+.5;
        s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*55}%;left:${Math.random()*100}%;--a:${Math.random()*.8+.2};--b:${Math.random()*.15};--d:${(Math.random()*4+2).toFixed(1)}s;animation-delay:${(Math.random()*5).toFixed(1)}s`;
        container.appendChild(s);
    }
}
const weekDays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
function pad(n){return String(n).padStart(2,'0');}
function updateClock(){
    const now = new Date();
    document.getElementById('digiTime').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('clockDate').textContent = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekDays[now.getDay()]}`;
}
setInterval(updateClock,1000); updateClock();
let activeIndex = 1;
const item1 = document.getElementById('htItem1'), item2 = document.getElementById('htItem2');
function switchHitokoto(text) {
    const current = activeIndex === 1 ? item1 : item2;
    const next = activeIndex === 1 ? item2 : item1;
    next.textContent = text; current.classList.remove('active'); next.classList.add('active');
    activeIndex = activeIndex === 1 ? 2 : 1;
}
let lastHitokoto = '';
async function fetchHitokoto() {
    try { const res = await fetch('https://v1.hitokoto.cn'); const data = await res.json(); if (data?.hitokoto && data.hitokoto !== lastHitokoto) { lastHitokoto = data.hitokoto; switchHitokoto(`「${data.hitokoto}」`); } } catch (e) {}
}
fetchHitokoto(); window.hitokotoInterval = setInterval(fetchHitokoto, 30000);
initStars(); initParticles(); applySettings();

const BIN_ID = '6a2a15f7da38895dfeaa9630';
const API_KEY = '$2a$10$hxCwaa9VTSuns2o6OiUV/.gEIZ1wzMQYlNgwWVf1OfXDNY1lJMkGO';
const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest?t=${Date.now()}`;
async function loadCloudConfig() {
    try {
        const res = await fetch(BIN_URL, { headers: { 'X-Master-Key': API_KEY } });
        const json = await res.json(); const data = json.record;
        if (data.title) settings.name = data.title;
        if (data.email) settings.email = data.email;
        if (data.telegram) settings.telegram = data.telegram;
        if (data.avatar) settings.avatar = data.avatar;
        if (data.bgMobile) settings.bgMobile = data.bgMobile;
        if (data.bgDesktop) settings.bgDesktop = data.bgDesktop;
        if (data.hitokotoEnabled !== undefined) settings.hitokoto = data.hitokotoEnabled;
        if (data.particlesEnabled !== undefined) settings.particles = data.particlesEnabled;
        if (data.starsEnabled !== undefined) settings.stars = data.starsEnabled;
        if (data.text && data.text.trim() !== '') {
            document.getElementById('htItem1').textContent = data.text;
            document.getElementById('htItem1').classList.add('active');
            document.getElementById('htItem2').classList.remove('active');
            if (window.hitokotoInterval) { clearInterval(window.hitokotoInterval); window.hitokotoInterval = null; }
        }
        applySettings();
    } catch (e) {}
}
loadCloudConfig();

// --- ⚽ 全新11人制足球AI ---
(function() {
    const canvas = document.getElementById('footballCanvas');
    const ctx = canvas.getContext('2d');
    const W = 440, H = 264;
    const statusDiv = document.getElementById('footballStatus');
    const scoreRedEl = document.getElementById('scoreRed');
    const scoreBlueEl = document.getElementById('scoreBlue');

    const GOAL_Y_MIN = H * 0.3, GOAL_Y_MAX = H * 0.7, GOAL_DEPTH = 10;
    const PLAYER_SIZE = 8, BALL_SIZE = 6;
    const MAX_SPEED = 80, KICK_POWER = 170, PASS_POWER = 140, FRICTION = 80;
    const FORMATION = {
        'GK': { x: 0.04, y: 0.5 },
        'LB': { x: 0.18, y: 0.25 }, 'CB1': { x: 0.16, y: 0.45 }, 'CB2': { x: 0.16, y: 0.55 }, 'RB': { x: 0.18, y: 0.75 },
        'LM': { x: 0.35, y: 0.2 }, 'CM1': { x: 0.38, y: 0.4 }, 'CM2': { x: 0.38, y: 0.6 }, 'RM': { x: 0.35, y: 0.8 },
        'ST1': { x: 0.48, y: 0.35 }, 'ST2': { x: 0.48, y: 0.65 }
    };

    let scoreRed = 0, scoreBlue = 0;
    let players = [];
    let ball = { x: W/2, y: H/2, vx: 0, vy: 0 };
    let ballCarrier = null;
    let goalParticles = [];
    let goalFlash = 0;
    let lastTime = performance.now();

    function resetMatch() {
        players = [];
        const roles = ['GK','LB','CB1','CB2','RB','LM','CM1','CM2','RM','ST1','ST2'];
        for (let role of roles) {
            const pos = FORMATION[role];
            players.push({
                team: 'red', role, x: pos.x * W, y: pos.y * H,
                baseX: pos.x * W, baseY: pos.y * H,
                cooldown: 0
            });
        }
        for (let role of roles) {
            const pos = FORMATION[role];
            players.push({
                team: 'blue', role, x: W - pos.x * W, y: pos.y * H,
                baseX: W - pos.x * W, baseY: pos.y * H,
                cooldown: 0
            });
        }
        ball = { x: W/2, y: H/2, vx: 0, vy: 0 };
        ballCarrier = null;
        goalParticles = [];
        goalFlash = 0;
        statusDiv.textContent = '⚽ 比赛进行中...';
    }

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function dist(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx*dx + dy*dy); }

    function getTeammates(team) { return players.filter(p => p.team === team); }
    function getOpponents(team) { return players.filter(p => p.team !== team); }

    function aiUpdate(dt, now) {
        const carrier = ballCarrier !== null ? players[ballCarrier] : null;
        const attackingTeam = carrier ? carrier.team : (ball.x > W/2 ? 'blue' : 'red');
        const defendingTeam = attackingTeam === 'red' ? 'blue' : 'red';

        // 1. 计算每个球员的目标位置
        for (let p of players) {
            let targetX = p.baseX;
            let targetY = p.baseY;
            const isGoalie = p.role === 'GK';

            if (p === carrier) {
                // 持球者：带球向对方球门推进
                const goalX = p.team === 'red' ? W - 30 : 30;
                targetX = clamp(p.x + (goalX - p.x) * 0.3, 20, W - 20);
                targetY = clamp(p.y + (Math.random() - 0.5) * 20, 25, H - 25);
            } else if (isGoalie) {
                // 门将：跟随球的位置，但限于禁区
                targetX = p.team === 'red' ? 15 : W - 15;
                targetY = clamp(ball.y, GOAL_Y_MIN + 8, GOAL_Y_MAX - 8);
            } else {
                // 普通球员跑位逻辑
                const isAttacker = p.team === attackingTeam;
                const isDefender = p.team === defendingTeam;

                if (isAttacker) {
                    // 进攻方：向前移动，拉开空间接应
                    const forwardDir = p.team === 'red' ? 1 : -1;
                    targetX = clamp(p.baseX + forwardDir * (ball.x - W/2) * 0.15, 30, W - 30);
                    targetY = clamp(p.baseY + (ball.y - H/2) * 0.2, 25, H - 25);
                    // 靠近持球者准备接球
                    if (carrier && carrier.team === p.team && dist(p, carrier) > 40) {
                        targetX += (carrier.x - targetX) * 0.15;
                        targetY += (carrier.y - targetY) * 0.15;
                    }
                } else {
                    // 防守方：回收保护，盯防对方球员或球
                    const backDir = p.team === 'red' ? -1 : 1;
                    targetX = clamp(p.baseX + backDir * Math.abs(ball.x - W/2) * 0.1, 10, W - 10);
                    targetY = clamp(p.baseY + (ball.y - H/2) * 0.15, 25, H - 25);
                    // 向球的方向移动进行拦截
                    if (dist(p, ball) < 120) {
                        targetX += (ball.x - targetX) * 0.2;
                        targetY += (ball.y - targetY) * 0.2;
                    }
                }
            }

            // 平滑移动到目标位置
            const dx = targetX - p.x;
            const dy = targetY - p.y;
            const d = Math.sqrt(dx*dx + dy*dy);
            if (d > 1.5) {
                const speed = isGoalie ? MAX_SPEED * 0.8 : MAX_SPEED;
                const moveX = (dx / d) * speed * dt;
                const moveY = (dy / d) * speed * dt;
                p.x += moveX;
                p.y += moveY;
            }

            // 边界限制
            p.x = clamp(p.x, 5, W - 5);
            p.y = clamp(p.y, 8, H - 8);
            if (isGoalie) {
                p.x = clamp(p.x, 4, 28);
                if (p.team === 'blue') p.x = clamp(p.x, W - 28, W - 4);
                p.y = clamp(p.y, GOAL_Y_MIN, GOAL_Y_MAX);
            }
            if (p.cooldown > 0) p.cooldown -= dt;
        }

        // 2. 球员间排斥力（防止重叠）
        for (let i = 0; i < players.length; i++) {
            for (let j = i + 1; j < players.length; j++) {
                const a = players[i], b = players[j];
                const d = dist(a, b);
                if (d < PLAYER_SIZE + 2 && d > 0.1) {
                    const nx = (a.x - b.x) / d;
                    const ny = (a.y - b.y) / d;
                    const push = (PLAYER_SIZE + 2 - d) * 0.4;
                    a.x += nx * push; a.y += ny * push;
                    b.x -= nx * push; b.y -= ny * push;
                }
            }
        }

        // 3. 持球者决策：射门或传球
        if (carrier && carrier.cooldown <= 0) {
            const goalX = carrier.team === 'red' ? W : 0;
            const distToGoal = Math.abs(carrier.x - goalX);
            const opponents = getOpponents(carrier.team);
            const nearestOppDist = Math.min(...opponents.map(o => dist(carrier, o)));

            // 射门条件：距离合适 且 有射门空间
            if (distToGoal < 140 && Math.random() < 0.02 && nearestOppDist > 25) {
                const targetY = GOAL_Y_MIN + Math.random() * (GOAL_Y_MAX - GOAL_Y_MIN);
                const angle = Math.atan2(targetY - carrier.y, goalX - carrier.x);
                ball.vx = Math.cos(angle) * KICK_POWER;
                ball.vy = Math.sin(angle) * KICK_POWER;
                ball.x = carrier.x; ball.y = carrier.y;
                ballCarrier = null;
                carrier.cooldown = 0.6;
            }
            // 传球条件：队友位置更好 或 被压迫
            else if (nearestOppDist < 35 && Math.random() < 0.03) {
                const teammates = getTeammates(carrier.team).filter(p => p !== carrier && p.role !== 'GK');
                if (teammates.length > 0) {
                    // 选择最靠前且安全的队友
                    let bestTm = teammates[0];
                    let bestScore = -Infinity;
                    for (let tm of teammates) {
                        const forwardness = carrier.team === 'red' ? tm.x : W - tm.x;
                        const d = dist(carrier, tm);
                        const score = forwardness * 1.5 - d;
                        if (score > bestScore) { bestScore = score; bestTm = tm; }
                    }
                    const angle = Math.atan2(bestTm.y - carrier.y, bestTm.x - carrier.x);
                    ball.vx = Math.cos(angle) * PASS_POWER;
                    ball.vy = Math.sin(angle) * PASS_POWER;
                    ball.x = carrier.x; ball.y = carrier.y;
                    ballCarrier = null;
                    carrier.cooldown = 0.5;
                }
            }
        }

        // 4. 球物理与球权转换
        if (ballCarrier === null) {
            // 摩擦力
            const speed = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
            if (speed > 0) {
                const friction = FRICTION * dt;
                if (friction >= speed) { ball.vx = 0; ball.vy = 0; }
                else { ball.vx *= (speed - friction)/speed; ball.vy *= (speed - friction)/speed; }
            }
            ball.x += ball.vx * dt;
            ball.y += ball.vy * dt;

            // 边界反弹
            if (ball.y < BALL_SIZE) { ball.y = BALL_SIZE; ball.vy = Math.abs(ball.vy)*0.4; }
            if (ball.y > H - BALL_SIZE) { ball.y = H - BALL_SIZE; ball.vy = -Math.abs(ball.vy)*0.4; }

            // 进球检测
            if (ball.x < BALL_SIZE) {
                if (ball.y > GOAL_Y_MIN && ball.y < GOAL_Y_MAX) { goalScored('blue'); return; }
                else { ball.x = BALL_SIZE; ball.vx = Math.abs(ball.vx)*0.3; }
            }
            if (ball.x > W - BALL_SIZE) {
                if (ball.y > GOAL_Y_MIN && ball.y < GOAL_Y_MAX) { goalScored('red'); return; }
                else { ball.x = W - BALL_SIZE; ball.vx = -Math.abs(ball.vx)*0.3; }
            }

            // 球员抢球
            for (let i = 0; i < players.length; i++) {
                const p = players[i];
                if (p.role === 'GK') continue;
                if (ballCarrier !== null) break;
                if (dist(p, ball) < 12) {
                    ballCarrier = i;
                    ball.vx = 0; ball.vy = 0;
                    break;
                }
            }
        } else {
            // 球跟随持球者
            const c = players[ballCarrier];
            ball.x = c.x;
            ball.y = c.y - 5;
            ball.vx = 0; ball.vy = 0;
        }

        // 5. 抢断：防守球员靠近持球者可断球
        if (ballCarrier !== null) {
            const carrier = players[ballCarrier];
            const opponents = getOpponents(carrier.team).filter(p => p.role !== 'GK');
            for (let opp of opponents) {
                if (dist(opp, carrier) < PLAYER_SIZE + 2 && Math.random() < 0.08 * dt) {
                    // 抢断成功
                    const idx = players.indexOf(opp);
                    ballCarrier = idx;
                    ball.vx = 0; ball.vy = 0;
                    break;
                }
            }
        }
    }

    function goalScored(team) {
        if (team === 'red') { scoreRed++; scoreRedEl.textContent = scoreRed; spawnGoalParticles(W - GOAL_DEPTH, ball.y, '#f87171'); statusDiv.textContent = '🔴 红队进球！'; }
        else { scoreBlue++; scoreBlueEl.textContent = scoreBlue; spawnGoalParticles(GOAL_DEPTH, ball.y, '#60a5fa'); statusDiv.textContent = '🔵 蓝队进球！'; }
        goalFlash = 1.0;
        setTimeout(() => { resetMatch(); statusDiv.textContent = '⚽ 比赛继续...'; }, 1800);
    }

    function spawnGoalParticles(x, y, color) {
        for (let i = 0; i < 25; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 40 + Math.random() * 120;
            goalParticles.push({ x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 1.0, decay: 0.8+Math.random()*1.5, size: 2+Math.random()*4, color });
        }
    }

    function draw() {
        ctx.fillStyle = '#2d5a1e'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#3a7228';
        for (let i = 0; i < 200; i++) { const gx = (i * 137 + 53) % W; const gy = (i * 251 + 89) % H; ctx.fillRect(gx, gy, 2, 2); }
        ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.strokeRect(1, 1, W-2, H-2);
        ctx.beginPath(); ctx.setLineDash([6, 6]); ctx.moveTo(W/2, 1); ctx.lineTo(W/2, H-1); ctx.stroke(); ctx.setLineDash([]);
        ctx.beginPath(); ctx.arc(W/2, H/2, 35, 0, Math.PI*2); ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.strokeRect(0, GOAL_Y_MIN, GOAL_DEPTH+25, GOAL_Y_MAX-GOAL_Y_MIN); ctx.strokeRect(W-GOAL_DEPTH-25, GOAL_Y_MIN, GOAL_DEPTH+25, GOAL_Y_MAX-GOAL_Y_MIN);
        ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(0, GOAL_Y_MIN, GOAL_DEPTH, GOAL_Y_MAX-GOAL_Y_MIN); ctx.fillRect(W-GOAL_DEPTH, GOAL_Y_MIN, GOAL_DEPTH, GOAL_Y_MAX-GOAL_Y_MIN);
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(0, GOAL_Y_MIN, GOAL_DEPTH, GOAL_Y_MAX-GOAL_Y_MIN); ctx.strokeRect(W-GOAL_DEPTH, GOAL_Y_MIN, GOAL_DEPTH, GOAL_Y_MAX-GOAL_Y_MIN);

        for (let p of players) {
            const color = p.team === 'red' ? '#f87171' : '#60a5fa';
            ctx.fillStyle = color; ctx.fillRect(p.x - PLAYER_SIZE/2, p.y - PLAYER_SIZE/2, PLAYER_SIZE, PLAYER_SIZE);
            if (p.role === 'GK') { ctx.fillStyle = '#fff'; ctx.fillRect(p.x-3, p.y-6, 6, 3); }
        }
        ctx.fillStyle = '#ffffff'; ctx.fillRect(ball.x - BALL_SIZE/2, ball.y - BALL_SIZE/2, BALL_SIZE, BALL_SIZE);
        ctx.fillStyle = '#1a1a1a'; ctx.fillRect(ball.x-2, ball.y-2, 4, 4);

        for (let p of goalParticles) { ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size); }
        ctx.globalAlpha = 1;
        if (goalFlash > 0) { ctx.fillStyle = `rgba(255,255,255,${goalFlash * 0.4})`; ctx.fillRect(0, 0, W, H); }
    }

    function gameLoop(timestamp) {
        const now = timestamp / 1000;
        let dt = (timestamp - lastTime) / 1000;
        lastTime = timestamp;
        if (dt > 0.1) dt = 0.1;
        if (goalFlash > 0) { goalFlash -= dt * 1.2; if (goalFlash < 0) goalFlash = 0; }
        for (let p of goalParticles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt; }
        goalParticles = goalParticles.filter(p => p.life > 0);
        aiUpdate(dt, now);
        draw();
        requestAnimationFrame(gameLoop);
    }

    resetMatch();
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
})();
</script>
</body>
